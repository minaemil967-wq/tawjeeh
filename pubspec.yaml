name: tawjeeh_antenna_align
description: "برنامج توجيه هوائيات الشبكات ومحاذاة الروابط اللاسلكية بدقة بالبوصلة والـ GPS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Location and Sensors
  geolocator: any
  flutter_compass: any
  sensors_plus: any
  
  # Network & Realtime Sync (Zero-config MQTT for live link rooms)
  mqtt_client: any
  http: any
  
  # Camera & AR
  camera: any
  
  # Local Storage & Utilities
  shared_preferences: any
  intl: any
  share_plus: any
  qr_flutter: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
