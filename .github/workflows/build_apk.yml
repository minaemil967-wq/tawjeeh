name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --verbose

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tawjeeh-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.1
          name: "Tawjeeh Pro v1.0.1 (Release APK)"
          body: |
            ### تطبيق توجيه ومحاذاة هوائيات الشبكات والربط اللاسلكي بدقة (Tawjeeh Pro) 📡🧭
            
            - **حقيبة أدوات الفني الميدانية 🧰:** حاسبة الإشارة المتوقعة (dBm)، خلو 60% لفرينل وارتفاع الصاري، فحص توازن القطبين (V/H)، حاسبة الطاقة الشمسية وسعة البطاريات، ومولد تقارير الاستلام والمشاركة عبر واتساب.
            - **توجيه متعدد الأجهزة:** اتصال حي مشفر بين هاتفين أو أكثر بدون سيرفرات يدوية.
            - **بوصلة هندسية 360 درجة:** حساب زاوية السمت والميل وقوس فتحة الشعاع (Beamwidth).
            - **ميزان ماء رقمي:** لضبط زاوية الرفع والخفض (Tilt).
            - **تنبيهات صوتية واهتزاز راداري:** عند الوصول لزاوية المحاذاة الدقيقة.
            - **كاميرا الواقع المعزز (AR Camera HUD):** رؤية الهوائي المقابل على شاشة الكاميرا مباشرة.
            - **وضع أوفلاين للأماكن النائية:** إمكانية إدخال إحداثيات الطرف المقابل يدوياً دون الحاجة لاتصال بالإنترنت.
            
            **طريقة التثبيت:**
            قم بتنزيل ملف `app-release.apk` وتثبيته مباشرة على هواتف الأندرويد.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
